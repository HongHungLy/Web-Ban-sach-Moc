<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tìm kiếm sách — Mộc Books</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <header class="header">
    <div class="wrap header-row">
      <a class="brand" href="../index.html"><span class="brand-mark">M</span>Mộc Books</a>
      
      <!-- Tìm kiếm nhanh trên Header -->
      <form class="search-bar-basic" id="quick-search-form" style="max-width:320px;flex:1;margin:0 15px">
        <input type="search" id="quick-search-input" placeholder="Tìm tên sách, tác giả..." aria-label="Tìm kiếm nhanh">
        <button class="button button-small" type="submit" style="padding:0 14px;height:32px">Tìm</button>
      </form>

      <nav class="nav" aria-label="Điều hướng chính">
        <a href="books.html">Tủ sách</a>
        <a href="categories.html">Danh mục</a>
        <a href="orders.html">Đơn mua</a>
      </nav>

      <div class="header-actions">
        <a class="icon-link" id="header-account-link" href="login.html" aria-label="Tài khoản">
          <span>♙</span><span id="header-user-name">Tài khoản</span>
        </a>
        <a class="icon-link" href="cart.html" aria-label="Giỏ hàng">
          <span>♧</span><span>Giỏ hàng</span>
          <span class="cart-badge" id="header-cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-top:24px;padding-bottom:50px">
    <!-- Breadcrumb -->
    <div style="margin-bottom:16px;font-size:13px;color:var(--muted)">
      <a href="../index.html" style="color:var(--green)">Trang chủ</a> / 
      <span style="color:var(--ink)">Tìm kiếm sách</span>
    </div>

    <div class="section-heading">
      <div>
        <span class="eyebrow">Khám phá kho tàng tri thức</span>
        <h2>Tìm kiếm sách nâng cao</h2>
        <p id="search-results-count">Nhập tiêu chí để tìm cuốn sách phù hợp nhất.</p>
      </div>
      <button class="button button-small" type="button" onclick="resetSearchPage()">Xóa bộ lọc</button>
    </div>

    <!-- Thanh tìm kiếm căn chỉnh đều, chuẩn layout -->
    <div class="filters" aria-label="Thanh tìm kiếm nâng cao">
      <div class="field search-field">
        <label for="search-input">Tên sách hoặc tác giả</label>
        <input id="search-input" type="search" placeholder="Nhập tên sách, tác giả...">
      </div>
      <div class="field">
        <label for="category-select">Phân loại sách</label>
        <select id="category-select">
          <option value="">Tất cả thể loại</option>
          <option value="Văn học">Văn học</option>
          <option value="Kỹ năng sống">Kỹ năng sống</option>
          <option value="Khoa học">Khoa học</option>
          <option value="Sách thiếu nhi">Sách thiếu nhi</option>
        </select>
      </div>
      <div class="field">
        <label for="min-price">Khoảng giá từ (đ)</label>
        <input id="min-price" class="price-format" type="text" placeholder="VD: 50.000" inputmode="numeric">
      </div>
      <div class="field">
        <label for="max-price">Đến khoảng giá (đ)</label>
        <input id="max-price" class="price-format" type="text" placeholder="VD: 200.000" inputmode="numeric">
      </div>
      <button class="button" id="search-submit-btn" type="button">Tìm kiếm</button>
    </div>

    <!-- Lưới hiển thị kết quả -->
    <div class="product-grid" id="search-results-list">
      <!-- Rendered by main.js -->
    </div>

    <!-- Phân trang kết quả tìm kiếm -->
    <div class="pagination" id="search-pagination" aria-label="Phân trang kết quả">
      <!-- Rendered by main.js -->
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-row">
      <div>
        <a class="brand" href="../index.html"><span class="brand-mark">M</span>Mộc Books</a>
        <p>Một góc nhỏ cho những câu chuyện lớn.</p>
      </div>
      <div class="footer-links">
        <a href="account.html">Tài khoản</a>
        <a href="orders.html">Lịch sử đơn hàng</a>
        <a href="cart.html">Giỏ hàng</a>
      </div>
    </div>
  </footer>

  <script src="../main.js"></script>
</body>
</html>
