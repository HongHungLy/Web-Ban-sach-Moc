<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập Quản trị viên — Mộc Books</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #223b2e;
      padding: 24px;
    }
    .admin-login-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }
    .admin-login-card .brand {
      justify-content: center;
      margin-bottom: 24px;
    }
    .admin-login-card h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 8px;
    }
    .admin-login-card p {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <a class="brand" href="index.html">
        <span class="brand-mark">M</span>Mộc Books
      </a>
      <span class="eyebrow" style="display:block;text-align:center;margin-bottom:6px">Hệ thống quản trị</span>
      <h1>Đăng nhập Quản trị viên</h1>
      <p>Truy cập bảng điều khiển và quản lý cửa hàng Mộc Books.</p>

      <form id="admin-login-form" class="stack">
        <div class="field">
          <label class="form-label" for="admin-user">Tài khoản quản trị</label>
          <input id="admin-user" type="text" placeholder="admin@mocbooks.vn" value="admin@mocbooks.vn">
        </div>
        <div class="field">
          <label class="form-label" for="admin-pass">Mật khẩu</label>
          <input id="admin-pass" type="password" placeholder="••••••••" value="admin123">
        </div>
        <p style="font-size:11px;color:var(--muted);margin:4px 0">
          <em>* Gợi ý: Có thể để nguyên hoặc nhập bất kỳ để vào trang quản trị.</em>
        </p>
        <button class="button" type="submit" style="width:100%;margin-top:10px">Vào trang quản trị →</button>
        <div style="text-align:center;margin-top:16px">
          <a class="text-link" href="index.html">← Quay lại trang chủ cửa hàng</a>
        </div>
      </form>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
