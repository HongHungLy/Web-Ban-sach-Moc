<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập Quản trị viên — Mộc Books</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body style="background:#223b2e;min-height:100vh;display:grid;place-items:center;padding:20px">
  <div style="background:white;border-radius:20px;padding:36px 32px;max-width:420px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,0.35)">
    <div style="text-align:center;margin-bottom:24px">
      <div style="display:inline-flex;align-items:center;gap:10px;font-family:'Lora','Merriweather',Georgia,serif;font-size:24px;color:#223b2e;font-weight:700">
        <span class="brand-mark" style="width:36px;height:36px;font-size:16px">M</span>
        Mộc Books Admin
      </div>
      <p style="margin:8px 0 0;font-size:12px;color:var(--muted)">Cổng đăng nhập dành riêng cho Quản trị viên</p>
    </div>

    <form id="admin-login-form">
      <div class="field" style="margin-bottom:14px">
        <label for="admin-username">Tài khoản quản trị</label>
        <input type="text" id="admin-username" placeholder="Tên đăng nhập admin" autocomplete="username">
      </div>
      <div class="field" style="margin-bottom:20px">
        <label for="admin-password">Mật khẩu</label>
        <input type="password" id="admin-password" placeholder="Nhập mật khẩu" autocomplete="current-password">
      </div>
      <button class="button" type="submit" style="width:100%;background:#223b2e;font-size:14px">Đăng nhập vào hệ thống</button>
      <div style="margin-top:16px;text-align:center;font-size:11px;color:var(--muted)">
        * Nhấn "Đăng nhập" để vào thẳng bảng điều khiển quản trị viên.
      </div>
    </form>

    <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--line);text-align:center">
      <a href="../index.html" class="text-link" style="font-size:12px">← Quay lại trang chủ bạn đọc</a>
    </div>
  </div>

  <script src="../main.js"></script>
</body>
</html>
